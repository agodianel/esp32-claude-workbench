[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-workbench"
version = "0.2.0"
description = "Multi-chip ESP32 firmware toolkit and agent skills for Claude Code, Codex, Cursor, Copilot, Gemini CLI and Antigravity"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["esp32", "esp-idf", "firmware", "claude-code", "codex", "agent-skills", "mcp", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
]

# The core is standard-library only and Python 3.9-compatible so the plugin launchers in
# bin/ run on any stock `python3` (macOS still ships 3.9) without installing anything.
dependencies = []

[project.urls]
Homepage = "https://github.com/agodianel/esp32-claude-workbench"
Issues = "https://github.com/agodianel/esp32-claude-workbench/issues"

[project.optional-dependencies]
docs = ["pypdf>=4.0"]
semantic = [
    "pypdf>=4.0",
    "sentence-transformers>=3.0.1",
    "faiss-cpu>=1.8.0",
]
dev = [
    "mcp>=1.2.0; python_version >= '3.10'",  # only for the SDK interop test
    "pypdf>=4.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
]

[project.scripts]
esp32wb = "esp32_workbench.cli:main"
esp32wb-mcp = "esp32_workbench.mcp_server:main"
# v0.1 command names, kept for compatibility
validate-mission = "esp32_workbench.mission:main"
generate-contract = "esp32_workbench.contract:main"
summarize-logs = "esp32_workbench.logs:main"
scan-pins = "esp32_workbench.pins:main"
analyze-sdkconfig = "esp32_workbench.sdkconfig:main"
check-stacks = "esp32_workbench.stacks:main"

[tool.setuptools]
# The repo-root skills/ folder ships inside the wheel as esp32_workbench/skills so
# `esp32wb install-skills` works from a plain pip/uvx install.
packages = ["esp32_workbench", "esp32_workbench.skills"]
package-dir = {"" = "src", "esp32_workbench.skills" = "skills"}

[tool.setuptools.package-data]
esp32_workbench = ["data/**/*"]
"esp32_workbench.skills" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests that require ESP32 hardware",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N802"]

[tool.coverage.run]
source = ["esp32_workbench"]
omit = ["tests/*", "*/docs_semantic.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
