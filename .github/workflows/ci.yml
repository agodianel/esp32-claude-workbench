name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          uv run --extra dev pytest --tb=short \
            --junitxml=reports/junit.xml \
            --cov=esp32_workbench --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: reports/
          retention-days: 30

  package:
    name: Package and launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel
        run: uv build --wheel
      - name: Wheel installs skills without a checkout
        run: |
          mkdir -p /tmp/proj
          uvx --from dist/*.whl esp32wb install-skills --agent all --project /tmp/proj
          test -f /tmp/proj/.claude/skills/esp32-pin-audit/SKILL.md
          test -f /tmp/proj/.agents/skills/esp32-crash-review/SKILL.md
      - name: No-install launchers run on plain python3
        run: |
          python3 bin/esp32wb chip esp32s3 > /dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 bin/esp32wb-mcp | grep -q pin_audit
      - name: Doctor on bundled templates
        run: for t in templates/*/; do python3 bin/esp32wb doctor "$t"; done
